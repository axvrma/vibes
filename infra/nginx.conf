events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Only the URI path is logged. Media tickets never enter gateway access logs.
    log_format private '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log private;
    map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }
    server {
        listen 80;
        server_name _;
        absolute_redirect off;
        client_max_body_size 1024M;
        client_body_timeout 300s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        location /dashboard/ { proxy_pass http://dashboard/; }
        location /app/ { proxy_pass http://app/; }
        location /api/ {
            proxy_pass http://server:3000;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }
        location = / { return 302 /app/; }
        location = /app { return 302 /app/; }
        location = /dashboard { return 302 /dashboard/; }
    }
}
