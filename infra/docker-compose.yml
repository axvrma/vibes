name: vibes

services:
  api-gateway:
    image: nginx:alpine
    ports:
      - "127.0.0.1:9001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - dashboard
      - app
    restart: unless-stopped

  server:
    build:
      context: ../server
      dockerfile: ../infra/server.Dockerfile
    volumes:
      - vibes_data:/app/data
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - DATABASE_PATH=/app/data/sqlite.db
      - MAX_UPLOAD_MB=1024
      - NODE_ENV=production
      - AUTH_ACCESS_TOKEN_SECRET=${AUTH_ACCESS_TOKEN_SECRET:?Set AUTH_ACCESS_TOKEN_SECRET in infra/.env}
      - AUTH_REFRESH_TOKEN_PEPPER=${AUTH_REFRESH_TOKEN_PEPPER:?Set AUTH_REFRESH_TOKEN_PEPPER in infra/.env}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:9001,http://127.0.0.1:9001}
      - MEDIA_ROOTS={}
      - TRUST_PROXY=uniquelocal,loopback
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 75s
    restart: unless-stopped

  dashboard:
    build:
      context: ../dashboard
      dockerfile: ../infra/dashboard.Dockerfile
    depends_on:
      - server
    restart: unless-stopped

  app:
    build:
      context: ../app
      dockerfile: ../infra/app.Dockerfile
    depends_on:
      - server
    restart: unless-stopped

volumes:
  vibes_data:
    driver: local
